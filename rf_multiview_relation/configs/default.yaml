seed: 42

paths:
  data_root: data
  outputs: outputs

data:
  mat_key: rxData
  normal_device: Tx1
  anomaly_devices: [Tx2, Tx3, Tx4, Tx5, Tx6, Tx7, Tx8]
  oracle_dir: oracle
  window_size: 2048
  stride: 1024
  max_windows_per_file: 256
  tx1_train_files: 400
  tx1_fit_files: 320
  tx1_calibration_files: 80
  tx1_holdout_files: 100
  norm_mode: power
  value_check_files_per_device: 3

representations:
  iq: true
  ap: true
  stft: true
  phase_unwrap: true
  phase_transform: raw
  stft:
    n_fft: 128
    win_length: 128
    hop_length: 64
    window: hann
    log_magnitude: true

encoder:
  latent_dim: 64
  epochs: 30
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.00001
  optimizer: Adam
  early_stopping: 5

cca:
  components: 16
  standardize: true
  regularization: 0.000001

relation:
  mode: signed_residual
  supported_modes: [signed_residual, absolute_residual, cosine, euclidean]
  pairs: [iq_ap, iq_stft, ap_stft]

detector:
  covariance: ledoit_wolf
  mahalanobis_eps: 0.000001

score_fusion:
  enabled: true
  alpha: 0.5
  robust_reference: calibration

file_scoring:
  percentile: 60
  ablation: [mean, p50, p60, p75, p90, p95, max]

threshold:
  percentile: 95
  source: tx1_calibration

experiment:
  main_seed: 42
  report_seeds: [42, 123, 2026]
  priority1_methods: [iq, concat, cca_relation, absolute_plus_relation]
  priority2_methods: [ap, stft, raw_relation]
  priority3_ablations: [cca_dimension, pair_selection, relation_mode]
  minimal_feasibility:
    normal: Tx1_holdout
    anomaly: Tx2
    methods: [iq, concat, cca_relation, absolute_plus_relation]
